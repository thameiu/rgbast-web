<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGBAST - version control for color</title>
    <meta name="description" content="Generate advanced color palettes with RGBAST, then version every change with snapshots, branches, folders, sharing, and accessibility tooling.">
    <meta name="keywords" content="RGBAST, RGB palette, color palette, palette generator, color picker, 3D color picker, accessibility contrast, brand colors, design system, color explorer">
    <link rel="canonical" href="https://rgbast.com/">
    <meta property="og:title" content="RGBAST - version control for color">
    <meta property="og:description" content="Generate advanced color palettes with RGBAST, then version every change with snapshots, branches, folders, sharing, and accessibility tooling.">
    <meta property="og:image" content="https://rgbast.com/preview.png">
    <meta property="og:image:secure_url" content="https://rgbast.com/preview.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://rgbast.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RGBAST - version control for color">
    <meta name="twitter:description" content="Generate advanced color palettes with RGBAST, then version every change with snapshots, branches, folders, sharing, and accessibility tooling.">
    <meta name="twitter:image" content="https://rgbast.com/preview.png">

    <script>
      (function () {
        const DEFAULT_TITLE = 'RGBAST - version control for color';
        const DEFAULT_DESC = 'Generate advanced color palettes with RGBAST, then version every change with snapshots, branches, folders, sharing, and accessibility tooling.';
        const url = new URL(window.location.href);
        const parts = url.pathname.split('/').filter(Boolean).map((p) => decodeURIComponent(p));
        const qTitle = (url.searchParams.get('title') || '').trim();
        const qOwner = (url.searchParams.get('owner') || '').trim();

        function upsertMeta(selector, attrs, content) {
          let tag = document.head.querySelector(selector);
          if (!tag) {
            tag = document.createElement('meta');
            Object.keys(attrs).forEach((k) => tag.setAttribute(k, attrs[k]));
            document.head.appendChild(tag);
          }
          tag.setAttribute('content', content);
        }

        function upsertCanonical(href) {
          let tag = document.head.querySelector('link[rel="canonical"]');
          if (!tag) {
            tag = document.createElement('link');
            tag.setAttribute('rel', 'canonical');
            document.head.appendChild(tag);
          }
          tag.setAttribute('href', href);
        }

        function applySeo(title, description) {
          const nextTitle = title || DEFAULT_TITLE;
          const nextDesc = description || DEFAULT_DESC;
          const canonical = url.origin + url.pathname + url.search;

          document.title = nextTitle;
          upsertMeta('meta[name="description"]', { name: 'description' }, nextDesc);
          upsertMeta('meta[property="og:title"]', { property: 'og:title' }, nextTitle);
          upsertMeta('meta[property="og:description"]', { property: 'og:description' }, nextDesc);
          upsertMeta('meta[property="og:url"]', { property: 'og:url' }, canonical);
          upsertMeta('meta[name="twitter:title"]', { name: 'twitter:title' }, nextTitle);
          upsertMeta('meta[name="twitter:description"]', { name: 'twitter:description' }, nextDesc);
          upsertCanonical(canonical);
        }

        if (parts.length === 0) {
          applySeo(DEFAULT_TITLE, DEFAULT_DESC);
          return;
        }

        if (parts[0] === 'search') {
          applySeo(
            'Search - RGBAST',
            'Search users and palettes on RGBAST with exact and similar color matching.'
          );
          return;
        }

        if (parts[0] === 'color' && parts[1]) {
          const hex = parts[1].replace('#', '').toUpperCase();
          applySeo(
            `#${hex} - RGBAST`,
            `Explore color #${hex}: RGB/HSL/CMYK spaces, contrast checks, color blindness simulation and 3D color picker.`
          );
          return;
        }

        if (parts[0] === 'login') {
          applySeo('Sign in - RGBAST', 'Generate and manage palettes in RGBAST by signing in to access your snapshots and dashboard.');
          return;
        }

        if (parts[0] === 'register') {
          applySeo('Create account - RGBAST', 'Generate your first palettes on RGBAST by creating an account and tracking color history.');
          return;
        }

        if (parts[0] === 'settings') {
          applySeo('Settings - RGBAST', 'Manage your RGBAST account settings and profile preferences.');
          return;
        }

        if (parts[0] === 'users' && parts[1]) {
          const username = qOwner || parts[1];
          if (parts.length >= 3) {
            const isNew = parts[2] === 'new';
            const pathTitle = parts[parts.length - 1] || '';
            const paletteTitle = qTitle || pathTitle;
            if (isNew) {
              applySeo(
                'New palette - RGBAST',
                'Create a new palette in RGBAST, generate colors, and save versioned snapshots.'
              );
            } else if (paletteTitle) {
              applySeo(
                `${paletteTitle} by ${username} - RGBAST`,
                `Generate-inspired palette "${paletteTitle}" by ${username} on RGBAST, with version history and branch context.`
              );
            } else {
              applySeo(
                `Palette by ${username} - RGBAST`,
                `Browse public palettes by ${username} on RGBAST.`
              );
            }
          } else {
            applySeo(
              `@${username} - RGBAST`,
              `View ${username}'s profile and public palettes on RGBAST.`
            );
          }
          return;
        }

        applySeo(DEFAULT_TITLE, DEFAULT_DESC);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
